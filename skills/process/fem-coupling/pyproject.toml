[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-fem-coupling"
version = "0.1.0"
description = "Link NeqSim process simulations and engineering documents to finite-element models: traceable design basis, NeqSim-derived film coefficients and discretisation targets, a dependency-free one-dimensional multilayer conduction solver, structured Gmsh meshing, scikit-fem and FEniCSx case generation, thermal and pressure stress, study quality gating, and U-value handoff."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]
neqsim = ["neqsim"]
fem = ["scikit-fem>=8", "meshio>=5", "gmsh>=4.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
