[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-sodir-open-data"
version = "0.1.0"
description = "Catalog and read-only client for the Sokkeldirektoratet (Norwegian Offshore Directorate, Sodir) open data: DataService REST (every FactPages table and layer), FactPages CSV, FactMaps map services, bulk shape/CSV/FGDB downloads, CO2 storage atlas themes. NLOD 2.0."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sodir_open_data = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
