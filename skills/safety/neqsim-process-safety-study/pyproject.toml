[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-process-safety-study"
version = "0.1.0"
description = "Orchestration of a process safety study: step registry with skills and agents per step, evidence gates, hand-calculation, profile, conservatism, tag-anchoring and reconciliation checks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
