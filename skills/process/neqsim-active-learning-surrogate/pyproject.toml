[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-active-learning-surrogate"
version = "0.1.0"
description = "Active-learning Gaussian-process surrogates of NeqSim flowsheets for fast uncertainty, optimisation and capacity-boundary studies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7.4"]
neqsim = ["neqsim>=3.29.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
