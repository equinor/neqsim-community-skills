[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-well-test-calibration"
version = "0.1.0"
description = "Well-test calibration from raw test-separator data with NeqSim: recombination, stock-tank conversion, lift-model tuning with priors, virtual flow meter."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
neqsim = ["neqsim>=3.0"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
