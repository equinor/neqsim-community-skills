name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pre-commit hooks (Black, skill metadata, manifest schema, calculation_basis)
        env:
          PRE_COMMIT_FROM_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRE_COMMIT_TO_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run pre-commit run --from-ref "$PRE_COMMIT_FROM_REF" --to-ref "$PRE_COMMIT_TO_REF"

      - name: Ensure pre-commit did not modify files
        run: git diff --exit-code

      - name: Run tests
        run: uv run pytest

      - name: Run catalog metadata tests
        run: uv run pytest skills/test_skill_metadata.py

      - name: Consolidation pass (advisory — near-duplicate & orphan skills)
        run: uv run python scripts/find_skill_overlap.py --threshold 0.82