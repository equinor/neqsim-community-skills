[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-reservoir-mercury-estimation"
version = "0.1.0"
description = "Screening estimate of mercury in the gas of a reservoir, prospect or discovery: shrinkage model on tested wells, analogue tests, NeqSim mineral limits and a report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
limits = ["neqsim"]
report = ["matplotlib>=3.7", "python-docx>=1.1"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
