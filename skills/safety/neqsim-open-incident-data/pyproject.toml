[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-open-incident-data"
version = "0.1.0"
description = "Keyless client and screening statistics for open offshore incident data from the US BSEE Data Center (incident investigations and the platform structure inventory): type counts per structure-year with exact Poisson intervals and explicit caveats."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
