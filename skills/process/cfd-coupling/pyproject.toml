[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-cfd-coupling"
version = "0.3.0"
description = "Link NeqSim process simulations and engineering documents to CFD: traceable design basis, NeqSim-derived single-phase and multiphase boundary conditions, OpenFOAM case generation and execution, study quality gating, and local enhancement factors."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]
neqsim = ["neqsim"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
