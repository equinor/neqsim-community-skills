[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-well-log-reading"
version = "1.0.0"
description = "Read DLIS, LIS (equinor/dlisio) and LAS well logs with provenance for NeqSim agentic workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["dlisio>=1.0", "numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7.4", "dliswriter>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
