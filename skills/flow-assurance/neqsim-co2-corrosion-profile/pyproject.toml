[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-co2-corrosion-profile"
version = "0.1.0"
description = "CO2 corrosion rates along a flowline profile (NORSOK M-506 Rev. 2, NeqSim electrolyte pH, dense-phase CO2) with a NeqSim materials review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]
neqsim = ["neqsim>=3.29.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
