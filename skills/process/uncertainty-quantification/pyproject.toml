[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-uncertainty-quantification"
version = "0.1.0"
description = "Monte Carlo uncertainty quantification, tornado sensitivity, and global sensitivity analysis for NeqSim tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]
neqsim = ["neqsim"]
sensitivity = ["SALib>=1.4", "numpy>=1.22"]
surrogate = ["chaospy>=4.3", "numpy>=1.22"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
