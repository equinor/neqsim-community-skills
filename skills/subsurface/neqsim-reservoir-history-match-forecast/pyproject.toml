[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-reservoir-history-match-forecast"
version = "0.1.0"
description = "Multi-reservoir compositional history match and forecast on NeqSim depletion paths, with hand-off to process models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
test = ["pytest>=7.4"]
neqsim = ["jneqsim"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
