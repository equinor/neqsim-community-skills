name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-py311:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"

      - name: Install runtime test dependencies (without developer tools)
        run: uv sync --locked --no-default-groups --extra test

      - name: Run runtime tests
        run: uv run --locked --no-default-groups --extra test pytest

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pre-commit hooks (Ruff, Black, skill metadata, manifest schema, calculation_basis)
        run: uv run pre-commit run --all-files

      - name: Ensure pre-commit did not modify files
        run: git diff --exit-code

      - name: Run tests
        run: uv run pytest

      - name: Run catalog metadata tests
        run: uv run pytest skills/test_skill_metadata.py

      - name: Consolidation pass (advisory — near-duplicate & orphan skills)
        run: uv run python scripts/find_skill_overlap.py --threshold 0.82