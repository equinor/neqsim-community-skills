[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-dynamic-model-identification"
version = "0.4.0"
description = "Dynamic process, PID and closed-loop model identification from imperfect plant data with equinor/TimeSeriesAnalysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pythonnet>=3.0.3", "numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
neqsim = ["neqsim>=3.0"]
plan = ["scipy>=1.10"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
