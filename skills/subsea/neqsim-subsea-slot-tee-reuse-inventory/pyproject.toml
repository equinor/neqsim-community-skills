[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-subsea-slot-tee-reuse-inventory"
version = "0.1.0"
description = "Inventory of free slots, spare tees/hubs and reusable lines in existing subsea infrastructure, with reuse-versus-new-build ranking and a lifetime check."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4", "jsonschema>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
subsea_slot_tee_reuse = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
