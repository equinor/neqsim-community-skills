[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-surf-field-layout-design"
version = "0.1.0"
description = "Screening design of subsea (SURF) field layouts and host placement from open map, bathymetry and licence-block data, for NeqSim community examples."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4", "matplotlib>=3.5"]
plot = ["matplotlib>=3.5"]
neqsim = ["neqsim"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
