[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-technology-assessment-report"
version = "0.1.0"
description = "Builds a technology assessment report (Markdown and Word) from assessment and FMIRR results."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
word = ["python-docx>=1.1"]
test = ["pytest>=7.4", "python-docx>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
