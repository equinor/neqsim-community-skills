[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-hazop-node-pack"
version = "1.0.0"
description = "Vendor-neutral HAZOP node-pack generator (marked-up P&IDs, node tables, seeded deviations) and P&ID safeguard placement rules."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pillow>=10.0"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
