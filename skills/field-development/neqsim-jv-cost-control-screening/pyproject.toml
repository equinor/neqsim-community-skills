[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-jv-cost-control-screening"
version = "0.1.0"
description = "Educational joint-venture cost-control toolkit: JIB-style statement parsing, variance analysis, reconciliation and identity checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pandas>=1.5", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=7.4"]
pdf = ["pymupdf>=1.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
