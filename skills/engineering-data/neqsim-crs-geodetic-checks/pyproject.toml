[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-crs-geodetic-checks"
version = "0.1.0"
description = "CRS and datum checks with explicit, provenance-recorded transformations (equinor/geodetic-engine or pyproj)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pyproj>=3.6"]

[project.optional-dependencies]
# geodetic-engine pins PROJ 9.9 and its own pyproj wheel; install it on purpose, in an environment that can take that pin.
geodetic-engine = ["pygeodetic-engine"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
