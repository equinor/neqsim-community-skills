[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-community-skills"
version = "0.1.0"
description = "Public community-contributed skills for NeqSim agentic engineering workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "NeqSim community" }]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "PyYAML>=6.0",
  "jsonschema>=4.0",
  "setuptools>=68",
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "python-docx>=1.1",
  "Pillow>=10.0",
  "dlisio>=1.0",
  "dliswriter>=1.2",
  "segyio>=1.9",
  "scipy>=1.10",
  "completor>=1.6",
  "pyproj>=3.6",
  "pythonnet>=3.0.3",
]
[dependency-groups]
dev = [
  "pytest>=8.0",
  "black>=25.1",
  "pre-commit>=4.0",
  "PyYAML>=6.0",
  "jsonschema>=4.0",
  "setuptools>=68",
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "python-docx>=1.1",
  "Pillow>=10.0",
  "dlisio>=1.0",
  "dliswriter>=1.2",
  "segyio>=1.9",
  "scipy>=1.10",
  "completor>=1.6",
  "pyproj>=3.6",
  "pythonnet>=3.0.3",
  "ruff>=0.5",
]

# Packages are discovered by setup.py from every skills/<category>/<skill>/src
# so `pip install -e .` makes all skill modules importable in one step.

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --import-mode=importlib"
testpaths = ["skills"]
# Per-skill src directories are added to sys.path by the root conftest.py,
# which auto-discovers every skills/<category>/<skill>/src folder.