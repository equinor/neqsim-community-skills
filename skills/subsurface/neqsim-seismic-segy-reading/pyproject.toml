[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-seismic-segy-reading"
version = "1.0.0"
description = "Read SEG-Y seismic (equinor/segyio): geometry, coordinates, sections, fences and evidence for NeqSim agentic workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["segyio>=1.9", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
