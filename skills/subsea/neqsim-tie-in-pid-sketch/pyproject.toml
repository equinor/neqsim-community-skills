[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-tie-in-pid-sketch"
version = "1.1.0"
description = "Conceptual P&ID sketches and subsea P&ID sheets (SVG and layout spec) of a tie-in, with completeness checks and a tie-in considerations register."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
